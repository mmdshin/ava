# The nurses' app on :8000 and the admin panel on :8001.
#
# Flutter's web files keep the same names in every build (main.dart.js,
# the icon font, ...), so browsers are told to check for a newer copy
# every time: "no-cache" means revalidate, and an unchanged file costs
# only a tiny 304 reply.

server {
    listen 8000;
    root /usr/share/nginx/html/app;
    index index.html;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8001;
    root /usr/share/nginx/html/admin;
    index index.html;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Search engines have no business in the admin panel.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
